
name: Finance News Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: finance-news-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executer le bot
        env:
          TOKEN_AI_DESCRYB_IMG: ${{ secrets.TOKEN_AI_DESCRYB_IMG }}
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python -u Agent_facebook1.py

      - name: Sauvegarder l'historique dans GitHub
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f historique_posts.json ]; then
            echo "{}" > historique_posts.json
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add historique_posts.json

          if ! git diff --cached --quiet; then
            git commit -m "Update publication history"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Aucun changement dans l'historique."
          fi
