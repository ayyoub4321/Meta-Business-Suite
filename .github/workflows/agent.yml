name: Agent Facebook Instagram

on:
  schedule:
    - cron: "0 * * * *"   # toutes les 3 heures (modifie selon ton besoin)
  workflow_dispatch:         # lancement manuel depuis l'onglet Actions

permissions:
  contents: write            # nécessaire pour sauvegarder historique_posts.json

concurrency:
  group: agent-facebook
  cancel-in-progress: false  # évite deux exécutions en même temps

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 10      # plus de blocage de 30 min

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 pillow cloudinary \
                      groq langchain-groq huggingface_hub

      - name: Lancer l'agent
        run: python -u Agent_facebook1.py
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TOKEN_AI_DESCRYB_IMG: ${{ secrets.TOKEN_AI_DESCRYB_IMG }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Sauvegarder l'historique
        run: |
          if [ ! -f historique_posts.json ]; then
            echo "{}" > historique_posts.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historique_posts.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans l'historique."
            exit 0
          fi
          git commit -m "Update publication history [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Historique poussé."
              exit 0
            fi
            echo "Tentative $i échouée, nouvel essai..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Échec du push après 5 tentatives."
          exit 1
