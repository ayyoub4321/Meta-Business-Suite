name: Agent Facebook Instagram

on:
  schedule:
    - cron: "0 * * * *"      # toutes les 3 heures (heure UTC)
  workflow_dispatch:           # lancement manuel depuis l'onglet Actions

permissions:
  contents: write              # nécessaire pour sauvegarder historique_posts.json

concurrency:
  group: agent-facebook
  cancel-in-progress: false    # évite deux exécutions en même temps

env:
  PYTHONUNBUFFERED: "1"        # affichage des print en temps réel
  PYTHONIOENCODING: "utf-8"    # évite les erreurs d'encodage (arabe, emojis)
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances système (police arabe + Raqm)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            fonts-noto-core fonts-dejavu-core \
            libraqm0 libfribidi0 libharfbuzz0b
          fc-list | grep -i -E "arabic|cairo|tajawal" | head -5 || true

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --progress-bar off
          echo "---- Versions installées ----"
          pip list 2>/dev/null | grep -i -E "groq|langchain|huggingface|pillow|arabic|bidi|cloudinary|feedparser|beautifulsoup|requests" || true

      - name: Vérifier les fichiers
        run: |
          ls -la
          ls -la fonts imgs 2>/dev/null || echo "Dossiers fonts/ ou imgs/ absents"

      - name: Lancer l'agent
        timeout-minutes: 10
        run: python -u Agent_facebook1.py
        env:
          PAGE_ID: ${{ secrets.PAGE_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TOKEN_AI_DESCRYB_IMG: ${{ secrets.TOKEN_AI_DESCRYB_IMG }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Sauvegarder l'historique
        if: always()           # sauvegarde même si l'agent a échoué après une publication
        run: |
          if [ ! -f historique_posts.json ]; then
            echo "{}" > historique_posts.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historique_posts.json
          if git diff --cached --quiet; then
            echo "Aucun changement dans l'historique."
            exit 0
          fi
          git commit -m "Update publication history [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "Historique poussé."
              exit 0
            fi
            echo "Tentative $i échouée, nouvel essai..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Échec du push après 5 tentatives."
          exit 1
