name: Test Backend Python

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verifier Python
        run: python --version

      - name: Verifier les fichiers du projet
        run: |
          test -f agent_facebook.py
          test -f requirements.txt
          echo "Les fichiers principaux du backend sont presents."
